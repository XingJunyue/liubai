name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.14.3' }
      - name: Unit tests
        run: gradle :app:testFullDebugUnitTest --no-daemon
      - name: Build release files
        run: |
          gradle :app:bundlePlayRelease :app:assembleFullRelease --no-daemon
          mkdir out
          cp app/build/outputs/bundle/playRelease/app-play-release.aab out/liubai-play-1.${{ github.run_number }}.aab
          cp app/build/outputs/apk/full/release/app-full-release.apk out/liubai-1.${{ github.run_number }}.apk
      - name: Build test apks (with x86 libs for the emulator)
        run: |
          gradle :app:assembleFullDebug :app:assembleFullRelease -PallAbi --no-daemon
          cp app/build/outputs/apk/full/debug/app-full-debug.apk out/test-debug.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk out/test-release.apk
      - uses: actions/upload-artifact@v4
        with: { name: out, path: out }

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Timetable image for OCR
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk python3-pil > /dev/null
          for v in zh zh_dense en de ja ko; do python3 tools/make_timetable.py out/tt-$v.png $v; done
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke.sh
      - name: Upload screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots && zip -q ../shots.zip * && cd ..
          gh release view ci-shots >/dev/null 2>&1 || gh release create ci-shots --prerelease --title "CI screenshots" --notes "测试截图，不是安装包"
          gh release upload ci-shots shots.zip --clobber

  publish:
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out, path: out }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "out/liubai-1.${{ github.run_number }}.apk" "out/liubai-play-1.${{ github.run_number }}.aab" \
            --title "留白 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" --target "${{ github.sha }}"

  # 非 main 分支：把安装包发成预发布（preview），方便先装上试；不影响正式发布
  preview:
    needs: [build, emulator]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out, path: out }
      - name: Publish preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b="${GITHUB_REF_NAME//\//-}"; b="${b%-redo}"
          n="${{ github.run_number }}"
          cp "out/liubai-1.$n.apk" "liubai-$b-preview-$n.apk"
          gh release create "preview-$b-$n" "liubai-$b-preview-$n.apk" --prerelease --latest=false \
            --title "预览：$b #$n" --notes "分支 $GITHUB_REF_NAME 的预览安装包（不是正式版）。$(git log -1 --pretty=%s)" --target "${{ github.sha }}"
